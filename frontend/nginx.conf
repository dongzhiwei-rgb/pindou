# 文件：nginx.conf
# 用途：提供前端静态资源、单页路由回退和后端 API 反向代理，并启用 HTTPS 传输加密。
# 使用：将域名证书放入 /etc/nginx/certs/（server.crt / server.key），并把两处 server_name 替换为实际域名。
# 版权：@董志伟-联系方式-makabak1204
# 最后修改：2026-08-25

# 后端上游连接池：单个 API 实例最多 128 条活动连接，每个 worker 最多保留 32 条空闲连接。
# 空闲连接 30 秒后回收，单连接处理 1000 次请求后轮换，避免失效连接长期滞留或无限增长。
upstream pindou_api {
    zone pindou_api 64k;
    server api:8080 max_conns=128;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 30s;
}

# HTTP：一律 301 跳转到 HTTPS，避免明文传输接口数据。
server {
    listen 80;
    server_name yysls.online; # TODO: 替换为实际域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    # 禁止 TRACE/TRACK 等调试方法，降低被探测风险。
    if ($request_method = TRACE) { return 405; }
    if ($request_method = TRACK) { return 405; }
    server_name yysls.online; # TODO: 替换为实际域名
    client_max_body_size 16m;

    # 静态与 API 文本响应开启 gzip 压缩，降低带宽与首屏/接口传输体积。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # TLS 证书与私钥（Let's Encrypt 生成的证书可改用 /etc/letsencrypt/live/<域名>/fullchain.pem 与 privkey.pem）。
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # HSTS：强制浏览器仅通过 HTTPS 访问（含子域）。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # 安全策略：限制可用特性；基础 CSP 允许同源脚本/样式与内联（后台管理页使用内联脚本与事件）。
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    root  /usr/share/nginx/html;
    index index.html;

    # API 反向代理：必须关闭代理缓冲，否则 SSE（开关/密钥状态/被踢事件）推送会被积压延迟。
    location /api/ {
        proxy_pass http://pindou_api;
        proxy_http_version 1.1;
        # 清除客户端 Connection 头，才能复用上游 keepalive 连接；响应结束后连接会可靠归还连接池。
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
